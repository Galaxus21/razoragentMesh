name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  python:
    name: Python suite (backend + buyer SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: razoragentMesh
    steps:
      - uses: actions/checkout@v4
        with:
          # The repository is named razorAgentMesh, but every backend module imports
          # razoragentMesh.packages.* and the repo root is a package -- so the directory
          # name IS the package name. On the case-sensitive runner the default checkout
          # path breaks all 641 of those imports.
          path: razoragentMesh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        # Pinned to match the service Dockerfiles; see docs/STATUTORY_RATES.md and the
        # Dockerfile comments for why these are pinned rather than floating.
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.141.1 uvicorn[standard]==0.52.4 pydantic==2.13.5 \
                      pynacl==1.6.2 redis==8.1.0 httpx==0.28.1 \
                      qdrant-client==1.19.0 python-multipart==0.0.32
          pip install pytest pytest-asyncio hypothesis fakeredis
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Node packages the cross-language tests execute
        # testCrossSdkTsPyCompatibility.py runs `node --import tsx` inside these two packages to
        # prove the TypeScript and Python SDKs canonicalize (RFC 8785) and sign to byte-identical
        # output. Without node and tsx on hand those six tests fail with
        # FileNotFoundError: 'node' -- and the cross-language guarantee goes unverified.
        working-directory: razoragentMesh/packages/buyerSdkTs
        run: npm install --no-audit --no-fund
      - name: Install the MCP server package for the same reason
        working-directory: razoragentMesh/packages/mcpServer
        run: npm install --no-audit --no-fund
      - name: Run tests
        working-directory: ${{ github.workspace }}/razoragentMesh
        run: python -m pytest tests/ packages/buyerSdkPy/tests/ -q --tb=short

  typescript:
    name: TypeScript suites
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: razoragentMesh
    strategy:
      fail-fast: false
      matrix:
        package: [mcpServer, buyerSdkTs, telemetryDashboard]
    steps:
      - uses: actions/checkout@v4
        with:
          # The repository is named razorAgentMesh, but every backend module imports
          # razoragentMesh.packages.* and the repo root is a package -- so the directory
          # name IS the package name. On the case-sensitive runner the default checkout
          # path breaks all 641 of those imports.
          path: razoragentMesh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: razoragentMesh/packages/${{ matrix.package }}
        run: npm install --no-audit --no-fund
      - name: Build the linked buyer SDK
        # The dashboard declares @razorpay/agent-buyer-sdk as file:../buyerSdkTs and its `types`
        # point at dist/, which is gitignored. Without this the type check fails with TS2307
        # before it can check anything. Mirrors the sdk stage in telemetryDashboard/Dockerfile.
        if: matrix.package == 'telemetryDashboard'
        working-directory: razoragentMesh/packages/buyerSdkTs
        run: npm install --no-audit --no-fund && npm run build
      - name: Type check
        working-directory: razoragentMesh/packages/${{ matrix.package }}
        run: npx tsc --noEmit
      - name: Test
        working-directory: razoragentMesh/packages/${{ matrix.package }}
        run: npm test

  claims:
    name: Documented claims match reality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: razoragentMesh
    steps:
      - uses: actions/checkout@v4
        with:
          # The repository is named razorAgentMesh, but every backend module imports
          # razoragentMesh.packages.* and the repo root is a package -- so the directory
          # name IS the package name. On the case-sensitive runner the default checkout
          # path breaks all 641 of those imports.
          path: razoragentMesh
      - name: No stale cross-language GST formula in docs
        # The GSTR-1 spec and the onboarding guide are live application assets served at
        # /docs/gstr1-invoice and /docs/onboarding, so a formula drift there ships to users.
        # Rule V-01 in .agents/rules/verification-standards.md.
        #
        # The previous pattern only matched the plain-text rendering, so it passed green while
        # DEVELOPER_ONBOARDING_GUIDE.md carried the superseded split written as LaTeX
        # (\lfloor \text{Rate} / 2 \rfloor). LaTeX markup is now stripped before matching, so
        # the same two tells are caught in plain text, \text{}/\lfloor, and \frac{}{} form.
        run: |
          stale=0
          while IFS= read -r doc; do
            flat=$(sed -E 's/\\(text|mathrm|operatorname|displaystyle|lfloor|rfloor|left|right|frac|times|cdot|quad)//g; s/[{}$]//g' "$doc")
            # Tell 1: the rate is halved BEFORE the multiply, instead of one divide by 200 at the end.
            halved=$(printf '%s\n' "$flat" | grep -nE '[Rr]ate[A-Za-z]*[[:space:]]*/[[:space:]]*2([^0-9]|$)')
            # Tell 2: one levy is defined as the REMAINDER of the other. Restricted to lines that
            # actually assign a levy, so prose such as "CGST Act, 2017 - CGST Rules" is not flagged.
            remainder=$(printf '%s\n' "$flat" | grep -nE '(CGST|SGST|cgstPaise|sgstPaise)[^=]*=' \
                        | grep -E '\-[[:space:]]*(CGST|SGST|cgstPaise|sgstPaise)')
            hits=$(printf '%s\n%s\n' "$halved" "$remainder" | grep -v '^$' | sort -t: -k1,1n -u)
            if [ -n "$hits" ]; then
              stale=1
              printf '%s\n' "$hits" | sed "s|^|${doc}:|"
            fi
          done < <(find . -name '*.md' -not -path '*/node_modules/*')
          if [ "$stale" -ne 0 ]; then
            echo "::error::Documentation describes the superseded asymmetric GST split"
            echo "::error::INV-02 is CGST = SGST = floor((Taxable x Rate) / 200); see GUIDE.md INV-02"
            exit 1
          fi
          echo "OK: no stale GST formula in documentation"
      - name: Statutory constants carry a citation
        run: |
          if ! grep -q "Notification No. 15/2024-Central Tax" packages/mandateEngine/constants/settlementConstants.py; then
            echo "::error::TCS constants lost their statutory citation (rule V-05)"
            exit 1
          fi
          echo "OK: TCS constants cite their notification"

  docs:
    name: Guides resolve against the code they document
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: razoragentMesh
    steps:
      - uses: actions/checkout@v4
        with:
          # The repository is named razorAgentMesh, but every backend module imports
          # razoragentMesh.packages.* and the repo root is a package -- so the directory
          # name IS the package name. On the case-sensitive runner the default checkout
          # path breaks all 641 of those imports.
          path: razoragentMesh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        # generateApiReference.py imports the three FastAPI apps and the Python SDK offline to
        # read their routes and exports, so their runtime dependencies must be present even
        # though no service starts. examples/python also needs pynacl to sign.
        run: >
          python -m pip install --upgrade pip &&
          pip install fastapi==0.141.1 uvicorn[standard]==0.52.4 pydantic==2.13.5
          pynacl==1.6.2 redis==8.1.0 httpx==0.28.1
          qdrant-client==1.19.0 python-multipart==0.0.32
      - name: Install Node dependencies
        # The TypeScript surface is read with the compiler itself, which resolves the SDK's and
        # the MCP server's own imports -- so their node_modules have to exist, not just the
        # dashboard's.
        run: |
          for package in mcpServer buyerSdkTs telemetryDashboard; do
            (cd "packages/$package" && npm ci --no-audit --no-fund)
          done
      - name: The examples compile
        # examples/typescript is typechecked against the SDK's real sources, not its published
        # types, so a change to a signature breaks here on the commit that made it.
        run: cd packages/buyerSdkTs && npx tsc --noEmit --project ../../examples/typescript/tsconfig.json
      - name: The examples run, and INV-02 holds
        # Not a smoke test. Both programs build a full AP2 mandate chain, verify it, then edit
        # the cart and verify again -- and exit non-zero unless the first passes and the second
        # fails. Signing is local, so this needs no service. The guides transclude regions of
        # these files, which is what makes that prose provably current.
        run: |
          ./packages/buyerSdkTs/node_modules/.bin/tsx examples/typescript/mandateChain.ts
          PYTHONPATH=packages/buyerSdkPy python examples/python/mandateChain.py
      - name: Regenerate the reference and fail on drift
        # The generated tables are committed so the dashboard can read them from disk without a
        # build step. That only stays honest if a change to an SDK signature forces the artifact
        # to be regenerated in the same commit -- otherwise the checker below would be validating
        # the guides against a snapshot of an API that no longer exists. The same applies to the
        # transcluded example regions, which are extracted into generated/exampleSnippets.json.
        run: |
          python scripts/generateApiReference.py
          (cd packages/telemetryDashboard && npm run docs:generate)
          if ! git diff --exit-code -- packages/telemetryDashboard/generated packages/telemetryDashboard/src/generated; then
            echo "::error::Generated reference is stale. Run:"
            echo "::error::  python scripts/generateApiReference.py"
            echo "::error::  cd packages/telemetryDashboard && npm run docs:generate"
            exit 1
          fi
      - name: Every symbol the guides name exists
        # Fails on a documented method, constructor argument, package name, service port or
        # route that the code does not have, and on a <Snippet> naming a region that does not.
        # See src/lib/reference/docSnippetChecks.ts.
        working-directory: razoragentMesh/packages/telemetryDashboard
        run: npm run docs:verify

  test-counts:
    name: Documented test counts match measurement
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: razoragentMesh
    steps:
      - uses: actions/checkout@v4
        with:
          # The repository is named razorAgentMesh, but every backend module imports
          # razoragentMesh.packages.* and the repo root is a package -- so the directory
          # name IS the package name. On the case-sensitive runner the default checkout
          # path breaks all 641 of those imports.
          path: razoragentMesh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        # Collection-only still imports every test module, so the suite's runtime
        # dependencies must be present even though no test executes.
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.141.1 uvicorn[standard]==0.52.4 pydantic==2.13.5 \
                      pynacl==1.6.2 redis==8.1.0 httpx==0.28.1 \
                      qdrant-client==1.19.0 python-multipart==0.0.32
          pip install pytest pytest-asyncio hypothesis fakeredis
      - name: Install Node dependencies
        run: |
          for package in mcpServer buyerSdkTs telemetryDashboard; do
            (cd "packages/$package" && npm ci --no-audit --no-fund)
          done
      - name: Counts in README, GUIDE and the knowledge base match measurement
        # Rule V-01: every published number carries the command that produced it. This
        # fails the build if any of the three documents is edited by hand.
        run: python scripts/countTests.py --check
