services:
  redis:
    image: redis:7-alpine
    container_name: razoragent_redis
    ports:
      - "6379:6379"
    volumes:
      - redisData:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - meshNetwork

  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: razoragent_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantData:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - meshNetwork

  mcpServer:
    build:
      context: ./packages/mcpServer
      dockerfile: Dockerfile
    container_name: razoragent_mcp_server
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - REDIS_URL=redis://redis:6379/0
      - MERCHANT_PRIVATE_KEY_HEX=${MERCHANT_PRIVATE_KEY_HEX}
      - HMAC_SECRET_KEY=${HMAC_SECRET_KEY}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - meshNetwork

  mandateEngine:
    build:
      context: ./packages/mandateEngine
      dockerfile: Dockerfile
    container_name: razoragent_mandate_engine
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - meshNetwork

  telemetryDashboard:
    build:
      context: ./packages/telemetryDashboard
      dockerfile: Dockerfile
    container_name: razoragent_telemetry_dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_TELEMETRY_SSE_URL=http://localhost:8000/api/v1/telemetry/stream
    depends_on:
      - mandateEngine
    networks:
      - meshNetwork

volumes:
  redisData:
  qdrantData:

networks:
  meshNetwork:
    driver: bridge
