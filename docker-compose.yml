services:
  redis:
    image: redis:7-alpine
    container_name: razoragent_redis
    ports:
      - "6379:6379"
    volumes:
      - redisData:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - meshNetwork

  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: razoragent_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantData:/qdrant/storage
    healthcheck:
      # The qdrant image ships no curl/wget, so probe the port from bash instead.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - meshNetwork

  mcp-server:
    build:
      # Root context so the mandate tools can link the real buyer SDK (file:../buyerSdkTs),
      # matching merchant-api, x402-gateway and telemetry-dashboard above.
      context: .
      dockerfile: packages/mcpServer/Dockerfile
    image: razoragent_mcp_server:latest
    container_name: razoragent_mcp_server
    # This port serves two HTTP faces: the MCP Streamable HTTP transport at /mcp, which an
    # external agent (Claude Desktop, Claude Code, Cursor) connects to by URL, and the REST
    # adapter (packages/mcpServer/src/http/httpAdapter.ts) that the buyer SDKs target, whose
    # getLiveSkuQuote/reserveInventoryLock/verifyShippingSla calls are plain HTTP.
    #
    # MCP_TRANSPORT=http because this container has no stdin_open/tty: the stdio transport
    # would attach to a closed stdin and never serve anything. Local development that wants
    # stdio runs the server directly instead.
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - MCP_TRANSPORT=http
      - REDIS_URL=redis://redis:6379/0
      # Where MCP tool activity is published so the dashboard renders an external agent's work.
      # Without this the panels stay dark until settlement, because the mandate engine is the
      # only in-service telemetry producer.
      - MANDATE_ENGINE_URL=http://mandate-engine:8000
      # Ranking for search_catalog runs in merchantApi, which owns the embedding model
      # and the Qdrant client; this service is TypeScript and has no embedder.
      - MERCHANT_API_URL=http://merchant-api:4002
      # negotiate_price runs the buyer half of the x402-INR alternating-offer protocol against
      # the gateway: a proof-of-work challenge and a micro-escrow debit per turn. Without this
      # the tool falls back to localhost:4003 and every negotiation reports the gateway
      # unreachable, while every other tool keeps working -- so the failure looks like a bug in
      # negotiation rather than a missing address.
      - X402_GATEWAY_URL=http://x402-gateway:4003
      - MERCHANT_PRIVATE_KEY_HEX=${MERCHANT_PRIVATE_KEY_HEX:-}
      - HMAC_SECRET_KEY=${HMAC_SECRET_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      # Hydration is a boot-time read of mesh:catalog:*, so the seeder must have finished
      # writing before this starts -- otherwise it reads an empty store and the seeded SKUs
      # stay unquotable until something restarts the server.
      catalog-seeder:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      # negotiate_price is the one tool that calls another service on the request path rather
      # than best-effort, so a gateway that is not up yet turns a demo's first negotiation into
      # an unreachable-host error. No cycle: x402-gateway waits only on redis.
      x402-gateway:
        condition: service_healthy
    networks:
      - meshNetwork

  catalog-seeder:
    # A one-shot init job, not a long-running service: it loads tests/fixtures/catalogFixtures.json
    # into Redis and Qdrant and exits. Reuses the merchant-api image because that is the one which
    # already carries redis and qdrant-client; the script and fixtures are mounted read-only so the
    # service images do not have to grow a scripts/ directory they never call.
    build:
      context: .
      dockerfile: packages/merchantApi/Dockerfile
    image: razoragent_merchant_api:latest
    container_name: razoragent_catalog_seeder
    command: ["python", "/app/scripts/seedCatalog.py"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./scripts:/app/scripts:ro
      - ./tests/fixtures:/app/tests/fixtures:ro
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: "no"
    networks:
      - meshNetwork

  merchant-api:
    build:
      context: .
      dockerfile: packages/merchantApi/Dockerfile
    image: razoragent_merchant_api:latest
    container_name: razoragent_merchant_api
    ports:
      - "4002:4002"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # Layer 3 publishes OOS_HEALED here. Unset, healingTelemetry.py falls back to
      # http://localhost:8000 -- which inside THIS container is nothing at all, so every heal
      # was published into the void and logged at DEBUG. The dashboard's self-healing tile could
      # only ever show the seeder's synthetic 214ms.
      - MANDATE_ENGINE_URL=http://mandate-engine:8000
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      catalog-seeder:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - meshNetwork

  mandate-engine:
    build:
      context: ./packages/mandateEngine
      dockerfile: Dockerfile
    image: razoragent_mandate_engine:latest
    container_name: razoragent_mandate_engine
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - meshNetwork

  x402-gateway:
    build:
      context: .
      dockerfile: packages/x402Gateway/Dockerfile
    image: razoragent_x402_gateway:latest
    container_name: razoragent_x402_gateway
    ports:
      - "4003:4003"
    environment:
      - REDIS_URL=redis://redis:6379/0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4003/api/v1/mesh/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - meshNetwork

  telemetry-dashboard:
    build:
      # Root context so the dashboard can link the real buyer SDK (file:../buyerSdkTs) and
      # drive live protocol runs, matching merchant-api and x402-gateway above.
      context: .
      dockerfile: packages/telemetryDashboard/Dockerfile
      # NEXT_PUBLIC_* vars are inlined into the client bundle at `next build` time, so this
      # must be a build arg, not a container `environment:` entry -- a runtime env var on
      # the runner stage has no effect on an already-built Next.js standalone bundle.
      args:
        - NEXT_PUBLIC_TELEMETRY_SSE_URL=${NEXT_PUBLIC_TELEMETRY_SSE_URL:-http://localhost:8000/api/v1/telemetry/stream}
    image: razoragent_telemetry_dashboard:latest
    container_name: razoragent_telemetry_dashboard
    ports:
      - "3000:3000"
    # Read at request time by the protocol driver (src/server/protocolDriver/driverConfig.ts).
    # Unlike NEXT_PUBLIC_* these are NOT build args: the driver runs server-side in the
    # container, where services resolve by compose service name rather than localhost.
    environment:
      - MCP_SERVER_URL=http://mcp-server:4001
      - MANDATE_ENGINE_URL=http://mandate-engine:8000
      - X402_GATEWAY_URL=http://x402-gateway:4003
      - MERCHANT_API_URL=http://merchant-api:4002
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/overview"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      mandate-engine:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
      merchant-api:
        condition: service_healthy
      x402-gateway:
        condition: service_healthy
    networks:
      - meshNetwork

volumes:
  redisData:
  qdrantData:

networks:
  meshNetwork:
    driver: bridge
