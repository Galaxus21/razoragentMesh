services:
  redis:
    image: redis:7-alpine
    container_name: razoragent_redis
    ports:
      - "6379:6379"
    volumes:
      - redisData:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - meshNetwork

  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: razoragent_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantData:/qdrant/storage
    networks:
      - meshNetwork

  mcp-server:
    build:
      context: ./packages/mcpServer
      dockerfile: Dockerfile
    image: razoragent_mcp_server:latest
    container_name: razoragent_mcp_server
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - REDIS_URL=redis://redis:6379/0
      - MERCHANT_PRIVATE_KEY_HEX=${MERCHANT_PRIVATE_KEY_HEX:-}
      - HMAC_SECRET_KEY=${HMAC_SECRET_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - meshNetwork

  merchant-api:
    build:
      context: .
      dockerfile: packages/merchantApi/Dockerfile
    image: razoragent_merchant_api:latest
    container_name: razoragent_merchant_api
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - meshNetwork

  mandate-engine:
    build:
      context: ./packages/mandateEngine
      dockerfile: Dockerfile
    image: razoragent_mandate_engine:latest
    container_name: razoragent_mandate_engine
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - meshNetwork

  x402-gateway:
    build:
      context: .
      dockerfile: packages/x402Gateway/Dockerfile
    image: razoragent_x402_gateway:latest
    container_name: razoragent_x402_gateway
    ports:
      - "4003:4003"
    environment:
      - PORT=4003
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - meshNetwork

  telemetry-dashboard:
    build:
      context: ./packages/telemetryDashboard
      dockerfile: Dockerfile
    image: razoragent_telemetry_dashboard:latest
    container_name: razoragent_telemetry_dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_TELEMETRY_SSE_URL=http://localhost:8000/api/v1/telemetry/stream
    depends_on:
      - mandate-engine
    networks:
      - meshNetwork

volumes:
  redisData:
  qdrantData:

networks:
  meshNetwork:
    driver: bridge
