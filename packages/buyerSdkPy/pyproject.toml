[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "razoragent_buyer_sdk"
version = "2.0.0"
description = "Autonomous AI Buyer Agent SDK for RazorAgent Mesh v2.0 (AP2 + x402 + Ed25519)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RazorAgent Mesh Team" }]
keywords = ["agentic-commerce", "ap2", "razorpay", "ed25519", "x402", "autonomous-agents"]
dependencies = [
    "pynacl>=1.5.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "hypothesis>=6.100.0",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["razoragent_buyer_sdk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["test_*.py", "test*.py"]
python_classes = ["Test*"]
python_functions = ["test*"]
