[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "razoragent-vector-healer"
version = "2.0.0"
description = "Layer 3 Out-of-Stock Vector Self-Healing Engine for RazorAgent Mesh v2.0"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0.0",
    "qdrant-client>=1.13.0",
    "fastembed>=0.3.0",
    "pynacl>=1.5.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
