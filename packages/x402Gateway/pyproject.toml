[project]
name = "razoragent-x402-gateway"
version = "2.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.0",
    "pydantic>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "redis[asyncio]>=5.0.0",
    "httpx>=0.27.0",
    "pynacl>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
