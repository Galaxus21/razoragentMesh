<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#3395FF"/>
    </linearGradient>
    <linearGradient id="razorBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3395FF"/>
      <stop offset="100%" stop-color="#0A1E4A"/>
    </linearGradient>
    <linearGradient id="bladeGrad1" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#3395FF"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="bladeGrad2" x1="90%" y1="100%" x2="10%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0C1B33"/>
    </linearGradient>
    <radialGradient id="eyePulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#00F2FE"/>
      <stop offset="80%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="coreGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <!-- Transparent Background -->

  <!-- Outer Mesh Network Grid (Subtle) -->
  <g stroke="#1E293B" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6">
    <line x1="256" y1="40" x2="256" y2="472" />
    <line x1="68" y1="148" x2="444" y2="364" />
    <line x1="68" y1="364" x2="444" y2="148" />
    <circle cx="256" cy="40" r="4" fill="#00F2FE" />
    <circle cx="256" cy="472" r="4" fill="#3395FF" />
    <circle cx="68" cy="148" r="4" fill="#3395FF" />
    <circle cx="444" cy="364" r="4" fill="#00F2FE" />
    <circle cx="68" cy="364" r="4" fill="#00F2FE" />
    <circle cx="444" cy="148" r="4" fill="#3395FF" />
  </g>

  <!-- Outer Hexagonal Mesh Enclosure -->
  <polygon points="256,76 412,166 412,346 256,436 100,346 100,166" 
           fill="none" stroke="#1D2E4D" stroke-width="2" />

  <!-- Top Razor Blade Wing (Sleek Angular Shard) -->
  <path d="M 120 180 
           L 256 102 
           L 392 180 
           L 340 210 
           L 256 162 
           L 172 210 Z" 
        fill="url(#bladeGrad1)" />

  <!-- Bottom Opposing Razor Blade Wing -->
  <path d="M 120 332 
           L 256 410 
           L 392 332 
           L 340 302 
           L 256 350 
           L 172 302 Z" 
        fill="url(#bladeGrad2)" />

  <!-- Left Razor Slicing Jaw -->
  <polygon points="100,192 164,228 164,284 100,320 84,256" 
           fill="url(#razorBlue)" opacity="0.9" />

  <!-- Right Razor Slicing Jaw -->
  <polygon points="412,192 348,228 348,284 412,320 428,256" 
           fill="url(#cyberCyan)" opacity="0.9" />

  <!-- Agent Eye Iris Ring (Hexagonal Targeting Aperture) -->
  <polygon points="256,186 316,221 316,291 256,326 196,291 196,221" 
           fill="#090E1A" stroke="url(#cyberCyan)" stroke-width="4" filter="url(#neonGlow)" />

  <!-- Dynamic Diagonal Razor Slash Cut across the Eye -->
  <line x1="160" y1="352" x2="352" y2="160" stroke="#00F2FE" stroke-width="3.5" stroke-linecap="round" />

  <!-- Central Agent Neural Core (Glowing Eye Pulse) -->
  <circle cx="256" cy="256" r="42" fill="url(#eyePulse)" filter="url(#coreGlow)" />
  <circle cx="256" cy="256" r="14" fill="#FFFFFF" />
  <circle cx="256" cy="256" r="6" fill="#00F2FE" />
</svg>