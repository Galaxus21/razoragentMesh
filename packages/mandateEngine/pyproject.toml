[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "razoragent-mandate-engine"
version = "2.0.0"
description = "Layer 4 Cryptographic Mandate & Settlement Engine for RazorAgent Mesh v2.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.0",
    "pydantic>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "redis[asyncio]>=5.0.0",
    "httpx>=0.27.0",
    "pynacl>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

