[project]
name = "razoragent-merchant-api"
version = "2.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.0",
    "pydantic>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "redis[asyncio]>=5.0.0",
    "qdrant-client>=1.13.0",
    "fastembed>=0.3.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
